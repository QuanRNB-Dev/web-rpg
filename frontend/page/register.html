<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../main.css">
    <link rel="stylesheet" href="../css/login/register.css">
    <title>Register</title>
</head>
<body>
    <div class="register-container">
        <div class="register-form">
            <div class="register-title">
                <h2>Đăng ký</h2>
            </div>
            <div class="input-register-group">
                <label for="name">Tên đăng nhập</label>
                <input type="text" id="name-register" name="name-register" placeholder="Nhập tên đăng nhập" />
            </div>
            <div class="input-register-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password-register" name="password-register" placeholder="Nhập mật khẩu" />
            </div>
            <div class="input-register-group">
                <label for="confirm-password">Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password-register" name="confirm-password-register" placeholder="Xác nhận mật khẩu" />
            </div>
            <div class="register-actions">
                <button id="register-button" type="submit">Đăng ký</button>
            </div>
            <div class="login-link">
                <p>Bạn đã có tài khoản? <a href="./login.html">Đăng nhập</a></p>
        </div>
    </div>
</body>
    <script src="../../backend/js/login/register.js"></script>
</html>
