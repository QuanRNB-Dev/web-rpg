<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./frontend/main.css" />
    <link rel="stylesheet" href="./frontend/css/login/login.css" />
    <link rel="stylesheet" href="./frontend/theme/theme.css" />
    <title>RPG</title>
  </head>
  <body>
    <div class="login-container" id="login-container">
      <div class="login-form">
        <div class="login-title">
          <h2>Đăng nhập</h2>
        </div>
        <div class="input-group">
          <label for="name">Tên đăng nhập</label>
          <input
            type="text"
            id="name-login"
            name="name-login"
            placeholder="Nhập tên đăng nhập"
          />
        </div>
        <div class="input-group">
          <label for="password">Mật khẩu</label>
          <input
            type="password"
            id="password-login"
            name="password-login"
            placeholder="Nhập mật khẩu"
          />
        </div>

        <div class="login-actions">
          <button id="login-button" type="submit">Đăng nhập</button>
        </div>
        <div class="create-account">
          <p>Bạn chưa có tài khoản? <a href="./register.html">Đăng ký</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
